<!DOCTYPE html>
<html>
<head>
  <title>PUNK SZN</title>
  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    img {
      width: 300px;
      height: 300px;
      margin-top: 20px;
      border-radius: 15px;
    }

    button {
      padding: 10px;
      margin: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>My NFT Viewer</h2>

<img id="nftImage" src="HL/hl1.png">

<br>

<button onclick="loadHL()">HL</button>
<button onclick="loadORG()">ORG</button>

<script>
let hlIndex = 0;
let orgIndex = 0;

const hl = ["hl1.png","hl2.png","hl3.png"];
const org = ["org1.png","org2.png","org3.png"];

function loadHL(){
  hlIndex = (hlIndex + 1) % hl.length;
  document.getElementById("nftImage").src = "HL/" + hl[hlIndex];
}

function loadORG(){
  orgIndex = (orgIndex + 1) % org.length;
  document.getElementById("nftImage").src = "ORG/" + org[orgIndex];
}
</script>

</body>
</html>
